<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Glass Location Guesser</title>

        <link rel="stylesheet" href="styles/pd_main.css">
        <link rel="stylesheet" href="styles/glg_main.css">
        <link rel="stylesheet" href="styles/glg_ui.css">

        <script type="importmap">
            {
                "imports": {
                    "three": "./scripts/vendor/three/three.module.js",
                    "three/addons/": "./scripts/vendor/three/addons/"
                }
            }
        </script>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <meta name="description" content="Game development and services.">
        <meta name="keywords" content="Development, Services, Gaming, Personal, Community">
        <meta name="author" content="Drawing Pad">
        <meta name="theme-color" content="#5CC0A0">
        <meta name="robots" content="index, follow">

        <meta name="twitter:title" content="Paddy's Dreamland™ — 3D Map of Glass">
        <meta name="twitter:description" content="A basic 3D map of Glass with a pointer. Made for the Beat Revival's #glassguessr channel.">
        <meta name="twitter:image" content="https://www.paddysdreamland.com/images/embeds/glg_banner1.png">
        <meta name="twitter:card" content="summary_large_image">

        <meta name="description" content="A digital sanctuary where you're allowed to exist without being judged, fixed, or misunderstood. Game development, music, streams, and a small creative community by Paddy.">

        <meta property="og:title" content="Paddy's Dreamland™ — 3D Map of Glass">
        <meta property="og:description" content="A basic 3D map of Glass with a pointer. Made for the Beat Revival's #glassguessr channel.">
        <meta property="og:image" content="https://www.paddysdreamland.com/images/embeds/glg_banner1.png">
        <meta property="og:site_name" content="Paddy's Dreamland™">
        <meta property="og:url" content="https://www.paddysdreamland.com">
        <meta property="og:type" content="website">
    </head>

    <body>
        <div id="map-holder"></div>

        <div id="loading-holder">
            <div class="activity-icon"></div>
            <div id="loading-label">Loading Glass</div>
        </div>

        <script type="module">
            import { createMap, horizontalDistance } from "./scripts/glg_map.js";
            import { LOCATIONS, locationPosition, validateLocations } from "./scripts/glg_locations.js";

            const loading = document.getElementById("loading-holder");
            const label = document.getElementById("loading-label");

            const map = createMap(document.getElementById("map-holder"));

            /* Exposed so addMarker can be driven from the console. */
            window.glgMap = map;

            map.onPick((pos) => {
                console.log("guess (model space)", pos.x.toFixed(1), pos.y.toFixed(1), pos.z.toFixed(1));
            });

            map.load((p) => {
                label.textContent = p === null
                    ? "Loading Glass"
                    : "Loading Glass " + Math.round(p * 100) + "%";
            }).then((info) => {
                loading.classList.add("hidden");
                console.log("model size", info.size, "center", info.center);
                console.log("lit (non-baked) materials:", info.litMaterials);
                console.log("pan bounds", info.panBounds.min, info.panBounds.max);
                console.log(
                    "%cglgMap.addMarker(x, y, z) drops a debug pointer in model space.",
                    "color:#39ff6a"
                );
                console.log("  glgMap.addFrostbiteMarker(x, y, z) takes raw in-game coordinates instead.");
                console.log("  glgMarkAll() drops a pointer on every location in glg_locations.js.");

                /* Run on load rather than on demand: a mistyped coordinate is
                   invisible until that round comes up in play. */
                const problems = validateLocations();
                if (problems.length) {
                    console.warn("location data problems:");
                    for (const problem of problems) console.warn("  " + problem);
                } else {
                    console.log("location data: " + LOCATIONS.length + " entries, all inside Glass");
                }

                window.glgMarkAll = () => LOCATIONS.map((l) => map.addMarker(locationPosition(l)));
            }).catch((err) => {
                label.textContent = "Failed to load Glass";
                console.error(err);
            });
        </script>

        <div class="version-date">26.09-1</div>
    </body>
</html>
