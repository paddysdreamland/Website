name: Deploy to Namecheap
on:
  push:
    branches: ['**']
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        if: github.ref_name == 'Release'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          message = """${{ github.event.commits[0].message }}"""
          repo = "${{ github.repository }}"
          repo_name = repo.split("/")[1]
          branch = "${{ github.ref_name }}"
          actor = "${{ github.actor }}"

          # Split summary and description
          parts = message.split("\n", 1)
          body = parts[1].strip() if len(parts) > 1 else parts[0].strip()

          # Fetch GitHub display name
          req = urllib.request.Request(
            f"https://api.github.com/users/{actor}",
            headers={
              "User-Agent": "DiscordBot (https://github.com, 1.0)",
              "Accept": "application/vnd.github+json"
            }
          )
          with urllib.request.urlopen(req) as res:
            user_data = json.loads(res.read())
          display_name = user_data.get("name") or actor

          payload = {
            "username": display_name,
            "avatar_url": f"https://github.com/{actor}.png",
            "content": f"{body}\n\n- [{display_name}](<https://github.com/{actor}>) on [{repo_name}/{branch}](<https://github.com/{repo}/tree/{branch}>)"
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
            os.environ["DISCORD_WEBHOOK"] + "?wait=true",
            data=data,
            headers={
              "Content-Type": "application/json",
              "User-Agent": "DiscordBot (https://github.com, 1.0)"
            },
            method="POST"
          )
          urllib.request.urlopen(req)
          EOF