name: Deploy to Namecheap
on:
  push:
    branches: ['**']
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version + changelog
        if: github.ref_name == 'Release'
        run: |
          python3 << 'EOF'
          import json, subprocess

          RS, US = "\x1e", "\x1f"
          raw = subprocess.run(
              ["git", "log", "--reverse", "--date=format:%Y-%m",
               f"--pretty=format:{RS}%H{US}%ad{US}%aI{US}%s{US}%b"],
              capture_output=True, text=True, check=True
          ).stdout

          entries = []
          counts = {}
          for record in raw.split(RS):
              record = record.strip("\n")
              if not record:
                  continue
              commit_hash, year_month, iso_date, subject, body = record.split(US, 4)
              counts[year_month] = counts.get(year_month, 0) + 1
              version = f"{year_month[2:].replace('-', '.')}-{counts[year_month]}"
              entries.append({
                  "version": version,
                  "date": iso_date[:10],
                  "subject": subject.strip(),
                  "body": body.strip(),
              })

          version = entries[-1]["version"] if entries else "00.00-0"
          with open("version.json", "w") as f:
              json.dump({"version": version}, f)

          # Newest first, capped so the file doesn't grow unbounded over the repo's life.
          changelog = list(reversed(entries))[:30]
          with open("changelog.json", "w") as f:
              json.dump(changelog, f, indent=2)

          print(f"Version: {version}")
          print(f"Changelog entries written: {len(changelog)}")
          EOF

      - name: Deploy via FTP
        if: github.ref_name == 'Release'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          message = """${{ github.event.commits[0].message }}"""
          repo = "${{ github.repository }}"
          repo_name = repo.split("/")[1]
          branch = "${{ github.ref_name }}"
          actor = "${{ github.actor }}"

          # Split summary and description
          parts = message.split("\n", 1)
          body = parts[1].strip() if len(parts) > 1 else parts[0].strip()

          # Fetch GitHub display name
          req = urllib.request.Request(
            f"https://api.github.com/users/{actor}",
            headers={
              "User-Agent": "DiscordBot (https://github.com, 1.0)",
              "Accept": "application/vnd.github+json"
            }
          )
          with urllib.request.urlopen(req) as res:
            user_data = json.loads(res.read())
          display_name = user_data.get("name") or actor

          payload = {
            "username": display_name,
            "avatar_url": f"https://github.com/{actor}.png",
            "content": f"{body}\n\n- [{display_name}](<https://github.com/{actor}>) on [{repo_name}/{branch}](<https://github.com/{repo}/tree/{branch}>)"
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
            os.environ["DISCORD_WEBHOOK"] + "?wait=true",
            data=data,
            headers={
              "Content-Type": "application/json",
              "User-Agent": "DiscordBot (https://github.com, 1.0)"
            },
            method="POST"
          )
          urllib.request.urlopen(req)
          EOF
