name: Deploy to Namecheap
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MESSAGE=$(echo "${{ github.event.commits[0].message }}" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"username\": \"${{ github.actor }}\",
            \"avatar_url\": \"https://github.com/${{ github.actor }}.png\",
            \"content\": \"**[${{ github.repository }}:${{ github.ref_name }}]**\n${COMMIT_MESSAGE}\"
          }" \
          $DISCORD_WEBHOOK
