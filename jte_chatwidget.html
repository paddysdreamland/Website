<!DOCTYPE html>
<html lang="en">
    <head>
        <title>JtE – Chat Widget</title>
        <link rel="stylesheet" href="styles/jte_widgets.css">

        <script src="scripts/jte_twitch_chat.js"></script>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <div class="wrapper-bl">
            <div id="chat-wrapper" class="chat-wrapper">

        </div>
