<!DOCTYPE html>
<html lang="en">
    <head>
        <title>JtE – Stream Overlay</title>
        <link rel="stylesheet" href="styles/jte_widgets.css">
        <link rel="stylesheet" href="styles/obs_scenecards.css">
        <link rel="stylesheet" href="styles/pd_main.css">
        <link rel="stylesheet" href="styles/jte_layers.css">

        <script src="scripts/jte_log.js"></script>
        <!-- After jte_log.js so its warnings go through the console mirror and
             reach the overlay as log cards. -->
        <script src="scripts/jte_layers.js"></script>
        <!-- After jte_layers.js: it listens for the overlay:layers event that
             one emits, so it only runs while the wallpaper layer is on. -->
        <script src="scripts/jte_slideshow.js"></script>
        <script src="scripts/jte_control.js"></script>

        <script src="scripts/jte_twitch_chat.js"></script>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body style="background-color: transparent">
        <!-- Two slots so the slideshow can crossfade: one holds the picture on
             screen, the other loads the next one behind it, then they swap. -->
        <div id="wallpaper-holder">
            <div class="slide is-front"></div>
            <div class="slide"></div>
        </div>
        <div id="chat-anchor" class="wrapper-bl fullscreen">
            <div id="chat-wrapper" class="chat-wrapper-reverse fullscreen">
                <!-- Twitch and YouTube messages will appear here. -->
                <!-- Don't forget the helper script to bridge YouTube's chat. -->
            </div>
        </div>
    </body>
</html>
